<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Logística — Granja Ceballos{% endblock %}</title>
  <link href="/static/fonts/fonts.css" rel="stylesheet">
  <link href="/static/css/output.css" rel="stylesheet">
  <script defer src="/static/js/htmx.min.js"></script>
  <style>
    .estatus-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .estatus-pendiente {
      color: #fcd34d;
      background: rgba(252,211,77,0.1);
      text-shadow: 0 0 8px rgba(252,211,77,0.25);
    }
    .estatus-aceptado {
      color: #6ee7b7;
      background: rgba(110,231,183,0.1);
      text-shadow: 0 0 8px rgba(110,231,183,0.25);
    }
    .estatus-entregado {
      color: #93c5fd;
      background: rgba(147,197,253,0.1);
      text-shadow: 0 0 8px rgba(147,197,253,0.25);
    }
    .estatus-cancelado {
      color: #fca5a5;
      background: rgba(252,165,165,0.1);
      text-shadow: 0 0 8px rgba(252,165,165,0.25);
    }
    .estatus-rechazado {
      color: #fca5a5;
      background: rgba(252,165,165,0.1);
      text-shadow: 0 0 8px rgba(252,165,165,0.25);
    }
    @keyframes float-glow {
      0%, 100% { transform: translateY(0px); box-shadow: 0 0 8px rgba(110,231,183,0.15); }
      50% { transform: translateY(-3px); box-shadow: 0 0 20px rgba(110,231,183,0.3), 0 0 40px rgba(110,231,183,0.1); }
    }
    .btn-deliver {
      animation: float-glow 3s ease-in-out infinite;
    }

    .glass-chip {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }
    .action-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
      cursor: pointer;
    }
    .action-pill:hover {
      filter: brightness(1.35);
    }
    .card-glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
    }
    .nav-link { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.05em; transition: all 0.3s; }
    .nav-link.active { color: #DDAC23; border-bottom: 2px solid #DDAC23; padding-bottom: 0.25rem; }
    .nav-link:not(.active) { color: rgba(255,255,255,0.4); }
    .nav-link:not(.active):hover { color: rgba(255,255,255,0.7); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="font-sans min-h-screen bg-linear-to-b from-[#025270] to-primal-blue text-white">

  <div class="fixed inset-0 w-full h-full -z-10 overflow-hidden">
    <div class="absolute bottom-0 w-full h-[40vh] bg-linear-to-t from-white/15 via-[#DDAC23]/5 to-transparent pointer-events-none"></div>
  </div>

  {% include "nav.html" %}

  <main id="logistic-content" class="max-w-7xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <dialog id="ticket-modal"
          class="fixed inset-0 z-50 w-full h-full max-w-none max-h-none bg-black/70 backdrop-blur-sm p-4 open:flex items-center justify-center"
          onclick="if (event.target === this) this.close()">
    <div class="relative w-full max-w-2xl max-h-[90vh] bg-[#1F200B] rounded-2xl overflow-hidden border border-[#DDAC23]/20 shadow-2xl flex flex-col">
      <div class="flex items-center justify-between px-5 py-3 border-b border-white/10">
        <span class="text-sm text-white/70 font-medium">Ticket del pedido</span>
        <button type="button" onclick="document.getElementById('ticket-modal').close()"
                class="text-white/40 hover:text-white/80 transition-colors text-xl leading-none">&times;</button>
      </div>
      <iframe id="ticket-frame" class="w-full flex-1 min-h-0 border-0" src="about:blank"></iframe>
    </div>
  </dialog>

  <script>
    function openTicketModal(pedidoId) {
      document.getElementById('ticket-frame').src = '/api/ticket/' + pedidoId + '.pdf';
      document.getElementById('ticket-modal').showModal();
    }
  </script>

</body>
</html>
