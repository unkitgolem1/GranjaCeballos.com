<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Logística — Granja Ceballos{% endblock %}</title>
  <link href="/static/fonts/fonts.css" rel="stylesheet">
  <link href="/static/css/output.css" rel="stylesheet">
  <script defer src="/static/js/htmx.min.js"></script>
  <style>
    .estatus-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .estatus-pendiente {
      color: #fcd34d;
      background: rgba(252,211,77,0.1);
      text-shadow: 0 0 8px rgba(252,211,77,0.25);
    }
    .estatus-aceptado {
      color: #6ee7b7;
      background: rgba(110,231,183,0.1);
      text-shadow: 0 0 8px rgba(110,231,183,0.25);
    }
    .estatus-entregado {
      color: #93c5fd;
      background: rgba(147,197,253,0.1);
      text-shadow: 0 0 8px rgba(147,197,253,0.25);
    }
    .estatus-cancelado {
      color: #fca5a5;
      background: rgba(252,165,165,0.1);
      text-shadow: 0 0 8px rgba(252,165,165,0.25);
    }
    .estatus-rechazado {
      color: #fca5a5;
      background: rgba(252,165,165,0.1);
      text-shadow: 0 0 8px rgba(252,165,165,0.25);
    }
    @keyframes float-glow {
      0%, 100% { transform: translateY(0px); box-shadow: 0 0 8px rgba(110,231,183,0.15); }
      50% { transform: translateY(-3px); box-shadow: 0 0 20px rgba(110,231,183,0.3), 0 0 40px rgba(110,231,183,0.1); }
    }
    .btn-deliver {
      animation: float-glow 3s ease-in-out infinite;
    }

    /* Status row colors */
    .order-row.estatus-row-aceptado,
    .order-row-mobile.estatus-row-aceptado {
      background: rgba(16,185,129,0.12) !important;
      border-left: 3px solid rgba(16,185,129,0.3) !important;
    }
    .order-row.estatus-row-rechazado,
    .order-row-mobile.estatus-row-rechazado {
      background: rgba(239,68,68,0.12) !important;
      border-left: 3px solid rgba(239,68,68,0.3) !important;
    }
    .order-row.estatus-row-entregado,
    .order-row-mobile.estatus-row-entregado {
      background: rgba(59,130,246,0.12) !important;
      border-left: 3px solid rgba(59,130,246,0.3) !important;
    }
    .order-row.estatus-row-cancelado,
    .order-row-mobile.estatus-row-cancelado {
      background: rgba(239,68,68,0.06) !important;
    }

    .nav-link { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.05em; transition: all 0.3s; }
    .nav-link.active { color: #DDAC23; border-bottom: 2px solid #DDAC23; padding-bottom: 0.25rem; }
    .nav-link:not(.active) { color: rgba(255,255,255,0.4); }
    .nav-link:not(.active):hover { color: rgba(255,255,255,0.7); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="font-sans min-h-screen bg-linear-to-b from-[#025270] to-primal-blue text-white">

  <div class="fixed inset-0 w-full h-full -z-10 overflow-hidden">
    <div class="absolute bottom-0 w-full h-[40vh] bg-linear-to-t from-white/15 via-[#DDAC23]/5 to-transparent pointer-events-none"></div>
  </div>

  {% include "nav.html" %}

  <main id="logistic-content" class="max-w-7xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
