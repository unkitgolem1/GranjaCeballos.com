<header class="sticky top-0 z-50 bg-[#0F1006]/60 backdrop-blur-md border-b border-white/5">
  <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <h1 class="text-sm font-heading tracking-tight">
        <span class="text-baroque">Logística</span>
        <span class="text-white/30 text-xs ml-2">Granja Ceballos</span>
      </h1>
    </div>
    <nav class="flex items-center gap-6">
      <a hx-get="/logistic/partial/pedidos?seccion=todo&estatus=pendiente"
         hx-target="#logistic-content" hx-swap="innerHTML transition:true"
         href="/logistic"
         class="nav-link{% if seccion_activa == 'pedidos' %} active{% endif %}"
         onclick="document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));this.classList.add('active')">
        📋 Pedidos
      </a>
      <a hx-get="/logistic/partial/clientes"
         hx-target="#logistic-content" hx-swap="innerHTML transition:true"
         href="/logistic/clientes"
         class="nav-link{% if seccion_activa == 'clientes' %} active{% endif %}"
         onclick="document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));this.classList.add('active')">
        👥 Clientes
      </a>
    </nav>
    <div class="flex items-center gap-4">
      <span class="text-white/40 text-xs">{{ user }}</span>
      <a href="/logistic/logout"
         class="text-xs text-white/40 hover:text-red-400 transition-colors">
        Salir
      </a>
    </div>
  </div>
</header>
