<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Granja Ceballos</title>

  {# ── Critical CSS inline (primer paint inmediato) ── #}
  <style>
    *,:before,:after{box-sizing:border-box;margin:0;padding:0;border:0 solid}
    html{-webkit-text-size-adjust:100%;line-height:1.5;font-family:Inter,Helvetica Neue,system-ui,sans-serif}
    body{min-height:100vh;background:linear-gradient(to bottom,#025270,#03738c);color:#fff;overflow-x:hidden}
    img,video{max-width:100%;height:auto;display:block}
    a{color:inherit;text-decoration:inherit}
    button{font:inherit;color:inherit;background:0 0;cursor:pointer}
    :root{--color-primal-blue:#03738c;--color-black-mesa:#1f200b;--color-teal-tree:#90bdb5;--color-baroque:#ddac23;--font-heading:'Playfair Display',Georgia,serif;--font-sans:Inter,Helvetica Neue,system-ui,sans-serif;--spacing:.25rem;--blur-sm:8px}
    .fixed{position:fixed}.absolute{position:absolute}.inset-0{inset:0}.-z-10{z-index:-10}.z-30{z-index:30}.z-40{z-index:40}.z-50{z-index:50}
    .flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-center{justify-content:center}.hidden{display:none}
    .w-full{width:100%}.h-full{height:100%}.h-\[40vh\]{height:40vh}.max-w-md{max-width:28rem}.max-w-5xl{max-width:64rem}.mx-auto{margin-inline:auto}.mb-6{margin-bottom:1.5rem}.mb-10{margin-bottom:2.5rem}.px-4{padding-inline:1rem}.px-10{padding-inline:2.5rem}.py-4{padding-block:1rem}.pb-24{padding-bottom:6rem}
    .text-center{text-align:center}.text-display{font-family:var(--font-heading);letter-spacing:-.05em;text-transform:uppercase}.font-sans{font-family:var(--font-sans)}
    .text-5xl{font-size:3rem;line-height:1}.text-lg{font-size:1.125rem;line-height:1.75}.text-baroque{color:#ddac23}.text-teal-tree{color:#90bdb5}.text-white{color:#fff}.text-white\/70{color:rgba(255,255,255,.7)}.font-semibold{font-weight:600}
    .pointer-events-none{pointer-events:none}.opacity-0{opacity:0}.transition-all{transition-property:all;transition-duration:.3s;transition-timing-function:cubic-bezier(.4,0,.2,1)}.duration-300{transition-duration:.3s}.duration-700{transition-duration:.7s}.duration-1000{transition-duration:1s}.ease-in-out{transition-timing-function:cubic-bezier(.4,0,.2,1)}
    .glass-mesa{background:rgba(31,32,11,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(144,189,181,.2);color:#90bdb5}.rounded-full{border-radius:3.4e38px}.rounded-2xl{border-radius:1rem}
    .bg-\[\#DDAC23\]{background-color:#ddac23}.text-\[\#1F200B\]{color:#1f200b}
    .bg-black\/40{background-color:rgba(0,0,0,.4)}.bg-black\/60{background-color:rgba(0,0,0,.6)}
    .animate-spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @keyframes hollywood-zoom{0%{opacity:0;transform:scale(.05)}30%{opacity:.7;transform:scale(1.12)}45%{opacity:1;transform:scale(.95)}55%{transform:scale(1.04)}65%{transform:scale(.98)}75%{transform:scale(1.01)}85%{transform:scale(1)}}.animate-hollywood-zoom{animation:hollywood-zoom 2.2s cubic-bezier(.08,.9,.3,1.1) forwards}
    @keyframes gold-glow{0%,100%{text-shadow:0 0 8px rgba(221,172,35,.3),0 0 30px rgba(221,172,35,.15),0 4px 20px rgba(0,0,0,.4)}50%{text-shadow:0 0 20px rgba(221,172,35,.6),0 0 60px rgba(221,172,35,.3),0 4px 20px rgba(0,0,0,.4)}}.animate-gold-glow{animation:gold-glow 3s ease-in-out 2s infinite}
    @keyframes hollywood-subtitle{0%{opacity:0;transform:translateY(15px)}50%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}.animate-hollywood-subtitle{animation:hollywood-subtitle 1.2s ease-out .8s both}
    @keyframes hollywood-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.animate-hollywood-float{animation:hollywood-float 3s ease-in-out 2s infinite}
    @keyframes hollywood-btn{0%{opacity:0;transform:scale(0) rotate(-8deg);box-shadow:0 0 0 transparent}50%{opacity:1;transform:scale(1.1) rotate(1deg)}70%{transform:scale(.95)}85%{transform:scale(1.03);box-shadow:0 0 30px rgba(221,172,35,.3)}100%{opacity:1;transform:scale(1);box-shadow:0 0 0 transparent}}.animate-hollywood-btn{animation:hollywood-btn 1s cubic-bezier(.34,1.56,.64,1) 1.8s both}
    @media(min-width:40rem){.sm\:text-7xl{font-size:4.5rem;line-height:1}.sm\:text-xl{font-size:1.25rem;line-height:1.75}}
  </style>

  {# ── Preload fonts críticas ── #}
  <link rel="preload" href="/static/fonts/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgA.woff2" as="font" type="font/woff2" crossorigin>

  {# ── Full CSS asíncrono (no bloquea render) ── #}
  <link rel="preload" href="/static/css/output.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="/static/fonts/fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="/static/css/output.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
  </noscript>

  <script src="/static/js/htmx.min.js" defer></script>
  <script defer src="/static/js/alpine.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body class="font-sans min-h-screen overflow-x-hidden bg-linear-to-b from-[#025270] to-primal-blue">
  <div id="fondo-animado" class="fixed inset-0 w-full h-full -z-10 transition-all duration-1000 ease-in-out overflow-hidden">
    <div class="absolute bottom-0 w-full h-[40vh] bg-linear-to-t from-white/15 via-[#DDAC23]/5 to-transparent pointer-events-none"></div>
  </div>

  {% block content %}{% endblock %}
  {% block footer %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
