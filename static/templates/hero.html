<!DOCTYPE html>

          "postalCode": "97350",
          "addressCountry": "MX"

        "areaServed": "Mérida",

          "https://www.instagram.com/granjaceballosoficial/"

          "name": "Granja Ceballos"

  <noscript>
    <link href="/static/css/output.css" rel="stylesheet">
    <link href="/static/fonts/fonts.css" rel="stylesheet">
  </noscript>
  <link rel="preconnect" href="https://ptxhwrzuefattcjiqfoq.supabase.co">

    <div class="absolute bottom-0 w-full h-[40vh] bg-linear-to-t from-white/15 via-[#DDAC23]/5 to-transparent pointer-events-none"></div>
  </div>

  <svg width="0" height="0" class="fixed pointer-events-none" aria-hidden="true">
    <defs>
      <filter id="fractal-noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
    </defs>
  </svg>

  {% block content %}{% endblock %}
  {% block footer %}{% endblock %}

<style>
@keyframes whatsapp-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.animate-whatsapp-float {
  animation: whatsapp-float 3s ease-in-out infinite;
}
</style>
</body>
</html>
