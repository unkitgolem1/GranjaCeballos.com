[project]
name = "granjaceballos-com"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.0",
    "granian>=2.7.9",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.1.0",
    "slowapi>=0.1.10",
    "weasyprint>=69.0",
]

[project.optional-dependencies]
granian = ["granian>=1.7.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.26.0",
    "pytest-benchmark>=5.1.0",
    "granian>=1.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pytest-benchmark]
min_rounds = 5
warmup = true
